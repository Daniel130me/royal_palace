packages:
  - "apps/*"
  - "packages/*"

overrides:
  "brace-expansion@<2.0.0": 1.1.21
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  deepmerge-ts: 8.0.2
  js-yaml: 4.3.2
  pg: 8.16.3
  postcss: 8.5.28
  prismjs: 1.30.0
  "source-map-js@<1.2.2": 1.2.2

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  es5-ext: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1145.0"
  - "@aws-sdk/s3-request-presigner@3.1145.0"
