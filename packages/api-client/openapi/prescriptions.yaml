openapi: 3.1.0
info:
  title: Royal Palace Prescription and Pharmacy API
  version: 1.2.0
  description: >-
    Internal service contract for synthetic-only prescription, substitution, dispensing, quote, and pharmacy-order workflows. Browser clients
    must access these operations through authenticated same-origin backend-for-frontend routes.
paths:
  /v1/pharmacy/prescriptions/{prescriptionId}/quotes:
    post:
      operationId: createPharmacyQuote
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePharmacyQuoteInput" }
      responses:
        "201": { $ref: "#/components/responses/PharmacyQuoteResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/quotes/{quoteId}:
    get:
      operationId: getPharmacyQuoteForPharmacy
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/QuoteId" }
      responses:
        "200": { $ref: "#/components/responses/PharmacyQuoteResponse" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/orders/{orderId}:
    get:
      operationId: getPharmacyOrderForPharmacy
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200": { $ref: "#/components/responses/PharmacyOrderResponse" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/patient/pharmacy/quotes/{quoteId}:
    get:
      operationId: getPharmacyQuoteForPatient
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/QuoteId" }
      responses:
        "200": { $ref: "#/components/responses/PharmacyQuoteResponse" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/patient/pharmacy/quotes/{quoteId}/accept:
    post:
      operationId: acceptPharmacyQuote
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/QuoteId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptPharmacyQuoteInput" }
      responses:
        "201": { $ref: "#/components/responses/PharmacyOrderResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/patient/pharmacy/orders/{orderId}:
    get:
      operationId: getPharmacyOrderForPatient
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200": { $ref: "#/components/responses/PharmacyOrderResponse" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/provider/prescriptions:
    post:
      operationId: createPrescriptionDraft
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionDraftInput" }
      responses:
        "201": { $ref: "#/components/responses/PrescriptionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/provider/prescriptions/{prescriptionId}/draft:
    patch:
      operationId: updatePrescriptionDraft
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PrescriptionDraftInput" }
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/PrescriptionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/provider/prescriptions/{prescriptionId}/sign:
    post:
      operationId: signPrescription
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, validUntil]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                validUntil: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/PrescriptionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/provider/prescriptions/{prescriptionId}/cancel:
    post:
      operationId: cancelPrescription
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reasonCode]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reasonCode:
                  type: string
                  enum:
                    - clinical_correction
                    - issued_in_error
                    - patient_safety
                    - superseded_by_amendment
                    - therapy_changed
      responses:
        "200": { $ref: "#/components/responses/PrescriptionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/provider/prescriptions/{prescriptionId}/substitutions/{proposalId}/decision:
    post:
      operationId: recordPractitionerSubstitutionDecision
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
        - { $ref: "#/components/parameters/ProposalId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubstitutionDecisionInput" }
      responses:
        "200": { $ref: "#/components/responses/SubstitutionProposalResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/prescriptions/{prescriptionId}:
    get:
      operationId: getPrescription
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      responses:
        "200":
          description: Role-minimized prescription view
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Prescription" }
                  - { $ref: "#/components/schemas/PharmacyPrescription" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/prescriptions/{prescriptionId}/dispense-events:
    get:
      operationId: listPrescriptionDispenseEvents
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
        - { in: query, name: cursor, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 25 },
          }
      responses:
        "200":
          description: Bounded immutable dispense-event history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseEventList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/patient/prescriptions/{prescriptionId}/send:
    post:
      operationId: sendPrescriptionToPharmacy
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, pharmacyOrganizationId]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                pharmacyOrganizationId: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/PrescriptionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/patient/prescriptions/{prescriptionId}/substitutions/{proposalId}/consent:
    post:
      operationId: recordPatientSubstitutionConsent
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
        - { $ref: "#/components/parameters/ProposalId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubstitutionDecisionInput" }
      responses:
        "200": { $ref: "#/components/responses/SubstitutionProposalResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/prescriptions:
    get:
      operationId: listPharmacyPrescriptions
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { in: query, name: cursor, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 25 },
          }
      responses:
        "200":
          description: Bounded pharmacy prescription queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PharmacyPrescriptionList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/prescriptions/{prescriptionId}/accept:
    post:
      operationId: acceptPharmacyPrescription
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Accepted prescription with pharmacy-minimized fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PharmacyPrescription" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/prescriptions/{prescriptionId}/substitutions:
    post:
      operationId: proposePrescriptionSubstitution
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubstitutionProposalInput" }
      responses:
        "201": { $ref: "#/components/responses/SubstitutionProposalResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/prescriptions/{prescriptionId}/dispense:
    post:
      operationId: recordPrescriptionDispenseEvent
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispenseEventInput" }
      responses:
        "201":
          description: Immutable dispense event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseEvent" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/pharmacy/prescriptions/{prescriptionId}/return:
    post:
      operationId: returnPrescriptionToPatient
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/PrescriptionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnToPatientInput" }
      responses:
        "200":
          description: Returned prescription with pharmacy-minimized fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PharmacyPrescription" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
  /v1/internal/prescriptions/expire-due:
    post:
      operationId: expireDuePrescriptions
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 100 },
          }
      responses:
        "200":
          description: Number of prescriptions expired by this bounded worker batch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [expired]
                properties:
                  expired: { type: integer, minimum: 0, maximum: 100 }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/WorkflowDisabled" }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    QuoteId:
      in: path
      name: quoteId
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      in: header
      name: x-organization-id
      required: true
      schema: { type: string, format: uuid }
    PrescriptionId:
      in: path
      name: prescriptionId
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      in: path
      name: proposalId
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      in: header
      name: x-request-id
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    AccessDenied:
      description: Authenticated actor is not authorized for the resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State transition, optimistic version, or invariant conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Prescription was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PrescriptionResponse:
      description: Full patient or issuing-practitioner prescription view
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Prescription" }
    PharmacyOrderResponse:
      description: Patient-accepted pharmacy order with its immutable quote snapshot and payment reference
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PharmacyOrder" }
    PharmacyQuoteResponse:
      description: Time-limited, immutable pharmacy quote snapshot
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PharmacyQuote" }
    SubstitutionProposalResponse:
      description: Substitution proposal with immutable consent and approval decisions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SubstitutionProposal" }
    WorkflowDisabled:
      description: Clinical workflows are disabled in this environment
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AcceptPharmacyQuoteInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    CreatePharmacyQuoteInput:
      type: object
      additionalProperties: false
      required: [currency, expectedPrescriptionVersion, fillNumber, lines, validForSeconds]
      properties:
        charges:
          type: array
          maxItems: 20
          default: []
          items: { $ref: "#/components/schemas/PharmacyQuoteChargeInput" }
        currency: { type: string, pattern: "^[A-Za-z]{3}$" }
        expectedPrescriptionVersion: { type: integer, minimum: 1 }
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PharmacyQuoteLineInput" }
        validForSeconds: { type: integer, minimum: 60, maximum: 86400 }
    PharmacyQuoteLineInput:
      type: object
      additionalProperties: false
      required: [prescriptionItemId, quantity, unitPriceMinor]
      properties:
        prescriptionItemId: { type: string, format: uuid }
        quantity: { type: string, pattern: "^(?:0|[1-9]\\d{0,8})(?:\\.\\d{1,3})?$" }
        substitutionProposalId: { type: string, format: uuid }
        unitPriceMinor: { type: string, pattern: "^\\d{1,16}$" }
    PharmacyQuoteChargeInput:
      type: object
      additionalProperties: false
      required: [amountMinor, code, label, type]
      properties:
        amountMinor: { type: string, pattern: "^\\d{1,16}$" }
        code: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
        label: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [TAX, FEE] }
    PharmacyQuoteLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          lineNumber,
          lineSubtotalMinor,
          medicationCode,
          medicationCodeSystem,
          medicationName,
          prescriptionItemId,
          quantity,
          quantityUnit,
          strength,
          substitutionProposalId,
          unitPriceMinor,
        ]
      properties:
        id: { type: string, format: uuid }
        lineNumber: { type: integer, minimum: 1 }
        lineSubtotalMinor: { type: string, pattern: "^\\d+$" }
        medicationCode: { type: [string, "null"] }
        medicationCodeSystem: { type: [string, "null"] }
        medicationName: { type: string }
        prescriptionItemId: { type: string, format: uuid }
        quantity: { type: string }
        quantityUnit: { type: string }
        strength: { type: [string, "null"] }
        substitutionProposalId: { type: [string, "null"], format: uuid }
        unitPriceMinor: { type: string, pattern: "^\\d+$" }
    PharmacyQuoteCharge:
      type: object
      additionalProperties: false
      required: [amountMinor, code, id, label, type]
      properties:
        amountMinor: { type: string, pattern: "^\\d+$" }
        code: { type: string }
        id: { type: string, format: uuid }
        label: { type: string }
        type: { type: string, enum: [TAX, FEE] }
    PharmacyQuote:
      type: object
      additionalProperties: false
      required:
        [
          charges,
          createdAt,
          currency,
          expiresAt,
          feeMinor,
          fillNumber,
          id,
          inventoryReservation,
          lines,
          orderId,
          patientId,
          pharmacyOrganizationId,
          prescriptionId,
          prescriptionRouteId,
          quoteNumber,
          status,
          subtotalMinor,
          taxMinor,
          totalMinor,
          updatedAt,
          version,
        ]
      properties:
        charges: { type: array, items: { $ref: "#/components/schemas/PharmacyQuoteCharge" } }
        createdAt: { type: string, format: date-time }
        currency: { type: string }
        expiresAt: { type: string, format: date-time }
        feeMinor: { type: string, pattern: "^\\d+$" }
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        id: { type: string, format: uuid }
        inventoryReservation:
          type: object
          additionalProperties: false
          required: [expiresAt, status]
          properties:
            expiresAt: { type: string, format: date-time }
            status: { type: string, enum: [HELD, RELEASED, CONSUMED, EXPIRED] }
        lines: { type: array, items: { $ref: "#/components/schemas/PharmacyQuoteLine" } }
        orderId: { type: [string, "null"], format: uuid }
        patientId: { type: string, format: uuid }
        pharmacyOrganizationId: { type: string, format: uuid }
        prescriptionId: { type: string, format: uuid }
        prescriptionRouteId: { type: string, format: uuid }
        quoteNumber: { type: string }
        status: { type: string, enum: [ACTIVE, ACCEPTED, EXPIRED, CANCELLED, SUPERSEDED] }
        subtotalMinor: { type: string, pattern: "^\\d+$" }
        taxMinor: { type: string, pattern: "^\\d+$" }
        totalMinor: { type: string, pattern: "^\\d+$" }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    PharmacyOrder:
      type: object
      additionalProperties: false
      required:
        [
          acceptedAt,
          createdAt,
          id,
          orderNumber,
          patientId,
          paymentId,
          pharmacyOrganizationId,
          prescriptionId,
          prescriptionRouteId,
          quote,
          status,
          updatedAt,
          version,
        ]
      properties:
        acceptedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        patientId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        pharmacyOrganizationId: { type: string, format: uuid }
        prescriptionId: { type: string, format: uuid }
        prescriptionRouteId: { type: string, format: uuid }
        quote: { $ref: "#/components/schemas/PharmacyQuote" }
        status:
          {
            type: string,
            enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, REFUND_PENDING, REFUNDED, DISPUTED],
          }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CursorPageInfo:
      type: object
      additionalProperties: false
      required: [endCursor, hasNextPage]
      properties:
        endCursor: { type: [string, "null"] }
        hasNextPage: { type: boolean }
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    NamedResource:
      type: object
      additionalProperties: false
      required: [displayName, id]
      properties:
        displayName: { type: string }
        id: { type: string, format: uuid }
    PrescriptionDraftInput:
      type: object
      additionalProperties: false
      required: [appointmentId, items, jurisdictionCode, patientId]
      properties:
        appointmentId: { type: string, format: uuid }
        clinicalNote: { type: string, minLength: 1, maxLength: 2000 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PrescriptionItemInput" }
        jurisdictionCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]+$"
        patientId: { type: string, format: uuid }
        previousPrescriptionId: { type: string, format: uuid }
    PrescriptionItemInput:
      type: object
      additionalProperties: false
      required:
        - dose
        - frequency
        - medicationName
        - quantity
        - quantityUnit
      properties:
        controlledMedication: { type: boolean, default: false }
        dose: { type: string, minLength: 1, maxLength: 240 }
        duration: { type: string, minLength: 1, maxLength: 120 }
        frequency: { type: string, minLength: 1, maxLength: 240 }
        instructions: { type: string, minLength: 1, maxLength: 1000 }
        medicationCode: { type: string, minLength: 1, maxLength: 120 }
        medicationCodeSystem: { type: string, format: uri, maxLength: 255 }
        medicationName: { type: string, minLength: 1, maxLength: 240 }
        quantity: { type: string, pattern: "^(?:0|[1-9]\\d{0,8})(?:\\.\\d{1,3})?$" }
        quantityUnit: { type: string, minLength: 1, maxLength: 64 }
        refillsAuthorized: { type: integer, minimum: 0, maximum: 99, default: 0 }
        route: { type: string, minLength: 1, maxLength: 120 }
        strength: { type: string, minLength: 1, maxLength: 120 }
        substitutionAllowed: { type: boolean, default: false }
    PrescriptionItem:
      allOf:
        - { $ref: "#/components/schemas/PrescriptionItemInput" }
        - type: object
          required:
            - balance
            - controlledMedication
            - duration
            - id
            - instructions
            - lineNumber
            - medicationCode
            - medicationCodeSystem
            - refillsAuthorized
            - route
            - strength
            - substitutionAllowed
          properties:
            balance: { $ref: "#/components/schemas/PrescriptionItemBalance" }
            duration: { type: [string, "null"] }
            id: { type: string, format: uuid }
            instructions: { type: [string, "null"] }
            lineNumber: { type: integer, minimum: 1 }
            medicationCode: { type: [string, "null"] }
            medicationCodeSystem: { type: [string, "null"] }
            route: { type: [string, "null"] }
            strength: { type: [string, "null"] }
    PrescriptionRoute:
      type: object
      additionalProperties: false
      required:
        [acceptedAt, cancellationReasonCode, cancelledAt, id, pharmacy, sentAt, status, version]
      properties:
        acceptedAt: { type: [string, "null"], format: date-time }
        cancellationReasonCode: { type: [string, "null"] }
        cancelledAt: { type: [string, "null"], format: date-time }
        id: { type: string, format: uuid }
        pharmacy: { $ref: "#/components/schemas/NamedResource" }
        sentAt: { type: string, format: date-time }
        status: { type: string, enum: [SENT, ACCEPTED, CANCELLED] }
        version: { type: integer, minimum: 1 }
    PrescriptionStatusHistory:
      type: object
      additionalProperties: false
      required: [fromStatus, id, occurredAt, reasonCode, toStatus]
      properties:
        fromStatus:
          { oneOf: [{ $ref: "#/components/schemas/PrescriptionStatus" }, { type: "null" }] }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        reasonCode: { type: string }
        toStatus: { $ref: "#/components/schemas/PrescriptionStatus" }
    PrescriptionStatus:
      type: string
      enum: [DRAFT, SIGNED, SENT, ACCEPTED, PARTIALLY_DISPENSED, DISPENSED, CANCELLED, EXPIRED]
    PrescriptionFillBalance:
      type: object
      additionalProperties: false
      required: [dispensedQuantity, fillNumber, remainingQuantity]
      properties:
        dispensedQuantity: { type: string }
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        remainingQuantity: { type: string }
    PrescriptionItemBalance:
      type: object
      additionalProperties: false
      required: [dispensedQuantity, fills, remainingQuantity, totalAuthorizedQuantity]
      properties:
        dispensedQuantity: { type: string }
        fills:
          type: array
          items: { $ref: "#/components/schemas/PrescriptionFillBalance" }
        remainingQuantity: { type: string }
        totalAuthorizedQuantity: { type: string }
    SubstitutionDecisionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, outcome]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [APPROVED, DECLINED] }
    SubstitutionProposalInput:
      type: object
      additionalProperties: false
      required:
        [expectedVersion, fillNumber, prescriptionItemId, proposedMedicationName, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        prescriptionItemId: { type: string, format: uuid }
        proposedMedicationCode: { type: string, minLength: 1, maxLength: 120 }
        proposedMedicationCodeSystem: { type: string, format: uri, maxLength: 255 }
        proposedMedicationName: { type: string, minLength: 1, maxLength: 240 }
        proposedStrength: { type: string, minLength: 1, maxLength: 120 }
        reasonCode:
          type: string
          enum:
            [
              brand_unavailable,
              formulation_unavailable,
              generic_available,
              patient_preference,
              supply_constraint,
            ]
    SubstitutionDecision:
      type: object
      additionalProperties: false
      required: [decisionKind, id, occurredAt, outcome]
      properties:
        decisionKind: { type: string, enum: [PATIENT_CONSENT, PRACTITIONER_APPROVAL] }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [APPROVED, DECLINED] }
    SubstitutionProposal:
      type: object
      additionalProperties: false
      required:
        - approvalMode
        - createdAt
        - decisions
        - fillNumber
        - id
        - prescriptionItemId
        - proposedMedicationCode
        - proposedMedicationCodeSystem
        - proposedMedicationName
        - proposedStrength
        - reasonCode
        - status
        - updatedAt
        - version
      properties:
        approvalMode: { type: string, enum: [DISABLED, PATIENT_ONLY, PATIENT_AND_PRACTITIONER] }
        createdAt: { type: string, format: date-time }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/SubstitutionDecision" }
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        id: { type: string, format: uuid }
        prescriptionItemId: { type: string, format: uuid }
        proposedMedicationCode: { type: [string, "null"] }
        proposedMedicationCodeSystem: { type: [string, "null"] }
        proposedMedicationName: { type: string }
        proposedStrength: { type: [string, "null"] }
        reasonCode: { type: string }
        status:
          type: string
          enum: [PROPOSED, PATIENT_CONSENTED, APPROVED, DECLINED, CANCELLED, USED]
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    DispenseLineInput:
      type: object
      additionalProperties: false
      required: [fillNumber, prescriptionItemId, quantity]
      properties:
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        prescriptionItemId: { type: string, format: uuid }
        quantity: { type: string, pattern: "^(?:0|[1-9]\\d{0,8})(?:\\.\\d{1,3})?$" }
        substitutionProposalId: { type: string, format: uuid }
    DispenseEventInput:
      type: object
      additionalProperties: false
      required: [dispenseEventId, expectedVersion, lines, occurredAt]
      properties:
        dispenseEventId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/DispenseLineInput" }
        occurredAt: { type: string, format: date-time }
    DispenseLine:
      type: object
      additionalProperties: false
      required:
        - dispensedMedicationCode
        - dispensedMedicationCodeSystem
        - dispensedMedicationName
        - dispensedStrength
        - fillNumber
        - id
        - prescriptionItemId
        - quantity
        - quantityUnit
        - substitutionProposalId
      properties:
        dispensedMedicationCode: { type: [string, "null"] }
        dispensedMedicationCodeSystem: { type: [string, "null"] }
        dispensedMedicationName: { type: string }
        dispensedStrength: { type: [string, "null"] }
        fillNumber: { type: integer, minimum: 0, maximum: 99 }
        id: { type: string, format: uuid }
        prescriptionItemId: { type: string, format: uuid }
        quantity: { type: string }
        quantityUnit: { type: string }
        substitutionProposalId: { type: [string, "null"], format: uuid }
    DispenseEvent:
      type: object
      additionalProperties: false
      required: [eventNumber, id, lines, occurredAt, prescriptionId, routeId]
      properties:
        eventNumber: { type: integer, minimum: 1 }
        id: { type: string, format: uuid }
        lines: { type: array, items: { $ref: "#/components/schemas/DispenseLine" } }
        occurredAt: { type: string, format: date-time }
        prescriptionId: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
    DispenseEventList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/DispenseEvent" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    ReturnToPatientInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              patient_requested_reroute,
              pharmacy_unable_to_fulfill,
              safety_review_required,
              stock_unavailable,
            ]
    PrescriptionBase:
      type: object
      additionalProperties: false
      required:
        - attestationMethod
        - cancelledAt
        - contentDigest
        - createdAt
        - id
        - items
        - jurisdictionCode
        - patient
        - practitioner
        - prescriptionNumber
        - previousPrescriptionId
        - routes
        - substitutionProposals
        - signedAt
        - status
        - statusHistory
        - updatedAt
        - validUntil
        - version
      properties:
        attestationMethod: { type: [string, "null"] }
        cancelledAt: { type: [string, "null"], format: date-time }
        contentDigest: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        items: { type: array, items: { $ref: "#/components/schemas/PrescriptionItem" } }
        jurisdictionCode: { type: string }
        patient: { $ref: "#/components/schemas/NamedResource" }
        practitioner: { $ref: "#/components/schemas/NamedResource" }
        prescriptionNumber: { type: string }
        previousPrescriptionId: { type: [string, "null"], format: uuid }
        routes: { type: array, items: { $ref: "#/components/schemas/PrescriptionRoute" } }
        substitutionProposals:
          type: array
          items: { $ref: "#/components/schemas/SubstitutionProposal" }
        signedAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/PrescriptionStatus" }
        statusHistory:
          type: array
          items: { $ref: "#/components/schemas/PrescriptionStatusHistory" }
        updatedAt: { type: string, format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
    Prescription:
      allOf:
        - { $ref: "#/components/schemas/PrescriptionBase" }
        - type: object
          required: [appointmentId, clinicalNote]
          properties:
            appointmentId: { type: string, format: uuid }
            clinicalNote: { type: [string, "null"] }
    PharmacyPrescription:
      description: Prescription view with appointmentId and clinicalNote omitted.
      $ref: "#/components/schemas/PrescriptionBase"
    PharmacyPrescriptionList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PharmacyPrescription" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
