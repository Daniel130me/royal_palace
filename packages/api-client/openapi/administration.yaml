openapi: 3.1.0
info:
  title: Royal Palace Administration Oversight API
  version: 1.0.0
paths:
  /api/admin/dashboard:
    get:
      operationId: getAdminDashboard
      parameters:
        - { name: dayFrom, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: dayTo, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Privacy-minimized operational dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /api/admin/complaints:
    get:
      operationId: listAdminComplaints
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/ComplaintPriority" } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - {
            name: scope,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/ComplaintScope" },
          }
      responses:
        "200":
          description: Bounded administrator complaint queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintList" }
  /api/admin/complaints/{complaintId}:
    patch:
      operationId: transitionAdminComplaint
      parameters:
        - { name: complaintId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: x-rp-csrf-token,
            in: header,
            required: true,
            schema: { type: string, minLength: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintTransitionInput" }
      responses:
        "200":
          description: Complaint status transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
  /api/admin/deliveries:
    get:
      operationId: listAdminDeliveryOversight
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - {
            name: scope,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/DeliveryScope" },
          }
      responses:
        "200":
          description: Bounded privacy-minimized delivery oversight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryList" }
  /api/admin/appointments:
    get:
      operationId: listAdminAppointments
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: dayFrom, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: dayTo, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/AppointmentScope" }
      responses:
        "200":
          description: Bounded administrator appointment projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentList" }
  /api/admin/audit-events:
    get:
      operationId: listAdminAuditEvents
      parameters:
        - { name: action, in: query, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: effectiveRole, in: query, schema: { $ref: "#/components/schemas/PlatformRole" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Bounded, privacy-minimized administrator audit projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
  /api/admin/practitioners:
    get:
      operationId: listAdminPractitioners
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - {
            name: scope,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/PractitionerScope" },
          }
      responses:
        "200":
          description: Bounded administrator practitioner-verification queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PractitionerList" }
  /api/admin/practitioners/{practitionerId}:
    get:
      operationId: getAdminPractitioner
      parameters:
        - { name: practitionerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Administrator practitioner-verification detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PractitionerDetail" }
  /api/admin/practitioners/{practitionerId}/verification:
    patch:
      operationId: transitionAdminPractitionerVerification
      parameters:
        - { name: practitionerId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: x-rp-csrf-token,
            in: header,
            required: true,
            schema: { type: string, minLength: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PractitionerTransitionInput" }
      responses:
        "200":
          description: Updated practitioner-verification detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PractitionerDetail" }
  /api/admin/principals:
    get:
      operationId: listAdminPrincipals
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/PlatformRole" } }
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/PrincipalScope" } }
      responses:
        "200":
          description: Bounded administrator identity-principal list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrincipalList" }
  /api/admin/principals/{principalId}/status:
    patch:
      operationId: transitionAdminPrincipalStatus
      parameters:
        - { name: principalId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: x-rp-csrf-token,
            in: header,
            required: true,
            schema: { type: string, minLength: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrincipalTransitionInput" }
      responses:
        "200":
          description: Updated identity principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
components:
  schemas:
    PageInfo:
      type: object
      additionalProperties: false
      required: [endCursor, hasNextPage]
      properties:
        endCursor: { type: [string, "null"] }
        hasNextPage: { type: boolean }
    AppointmentScope:
      type: string
      enum: [ALL, TODAY, UPCOMING, COMPLETED, UNSUCCESSFUL]
    PrincipalScope:
      type: string
      enum: [ALL, ACTIVE, DISABLED]
    Principal:
      type: object
      additionalProperties: false
      required: [createdAt, displayName, email, id, roles, status, updatedAt, version]
      properties:
        createdAt: { type: string, format: date-time }
        displayName: { type: string }
        email: { type: [string, "null"], format: email }
        id: { type: string, format: uuid }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/PlatformRole" }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    PrincipalList:
      type: object
      additionalProperties: false
      required: [data, pageInfo, summary]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Principal" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        summary:
          type: object
          additionalProperties: false
          required: [active, all, disabled]
          properties:
            active: { type: integer, minimum: 0 }
            all: { type: integer, minimum: 0 }
            disabled: { type: integer, minimum: 0 }
    PrincipalTransitionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, status]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    AppointmentStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELLED, COMPLETED]
    ConsultationMode:
      type: string
      enum: [VIDEO, AUDIO, CHAT, IN_PERSON, HOME_VISIT]
    AppointmentParty:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    Appointment:
      type: object
      additionalProperties: false
      required: [amountMinor, currency, endsAt, id, mode, patient, practitioner, startsAt, status]
      properties:
        amountMinor: { type: string, pattern: "^[0-9]+$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        endsAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/ConsultationMode" }
        patient: { $ref: "#/components/schemas/AppointmentParty" }
        practitioner: { $ref: "#/components/schemas/AppointmentParty" }
        startsAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
    AppointmentSummary:
      type: object
      additionalProperties: false
      required: [all, completed, today, unsuccessful, upcoming]
      properties:
        all: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        today: { type: integer, minimum: 0 }
        unsuccessful: { type: integer, minimum: 0 }
        upcoming: { type: integer, minimum: 0 }
    AppointmentList:
      type: object
      additionalProperties: false
      required: [data, pageInfo, summary]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        summary: { $ref: "#/components/schemas/AppointmentSummary" }
    PlatformRole:
      type: string
      enum:
        [
          PATIENT,
          MANAGER,
          ORGANIZATION_APPLICANT,
          ORGANIZATION_ADMIN,
          ORGANIZATION_STAFF,
          PROVIDER,
          SUPPORT,
          ADMINISTRATOR,
          FINANCE,
          LOGISTICS,
          SYSTEM_WORKER,
        ]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          action,
          actorPrincipalId,
          effectiveRole,
          id,
          occurredAt,
          reasonCode,
          resourceId,
          resourceType,
          result,
        ]
      properties:
        action: { type: string }
        actorPrincipalId: { type: [string, "null"], format: uuid }
        effectiveRole:
          oneOf:
            - { $ref: "#/components/schemas/PlatformRole" }
            - { type: "null" }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        reasonCode: { type: [string, "null"] }
        resourceId: { type: string, format: uuid }
        resourceType: { type: string }
        result: { type: string, enum: [DENIED, FAILED, SUCCEEDED] }
    AuditEventList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    ComplaintStatus:
      type: string
      enum: [OPEN, INVESTIGATING, RESOLVED, CLOSED]
    ComplaintPriority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    ComplaintScope:
      type: string
      enum: [ALL, OPEN, RESOLVED]
    Complaint:
      type: object
      additionalProperties: false
      required:
        [
          complainantType,
          complaintNumber,
          createdAt,
          description,
          id,
          priority,
          status,
          subject,
          updatedAt,
          version,
        ]
      properties:
        complainantType:
          oneOf:
            - { $ref: "#/components/schemas/PlatformRole" }
            - { type: string, const: EXTERNAL }
        complaintNumber: { type: string }
        createdAt: { type: string, format: date-time }
        description: { type: string }
        id: { type: string, format: uuid }
        priority: { $ref: "#/components/schemas/ComplaintPriority" }
        resolvedAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        subject: { type: string }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ComplaintSummary:
      type: object
      additionalProperties: false
      required: [all, open, resolved, urgent]
      properties:
        all: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }
        urgent: { type: integer, minimum: 0 }
    ComplaintList:
      type: object
      additionalProperties: false
      required: [data, pageInfo, summary]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Complaint" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        summary: { $ref: "#/components/schemas/ComplaintSummary" }
    ComplaintTransitionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, status]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        internalNote: { type: string, minLength: 1, maxLength: 2000 }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
    DeliveryScope:
      type: string
      enum: [ALL, ACTIVE, DELIVERED, EXCEPTION]
    DeliveryStatus:
      type: string
      enum:
        [
          ASSIGNED,
          ACCEPTED,
          HEADING_TO_PICKUP,
          ARRIVED_AT_PICKUP,
          PICKUP_VERIFIED,
          PICKED_UP,
          IN_TRANSIT,
          ARRIVED_AT_DESTINATION,
          DELIVERED,
          FAILED,
          RETURNED,
          CANCELLED,
        ]
    DeliveryArea:
      type: object
      additionalProperties: false
      required: [administrativeArea, countryCode, locality]
      properties:
        administrativeArea: { type: string }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        locality: { type: string }
        postalCode: { type: string }
    Delivery:
      type: object
      additionalProperties: false
      required:
        [
          courierAssigned,
          deliveryArea,
          deliveryNumber,
          handoffReference,
          id,
          logisticsOrganizationId,
          orderNumber,
          pharmacyOrganizationId,
          status,
          updatedAt,
        ]
      properties:
        courierAssigned: { type: boolean }
        deliveryArea: { $ref: "#/components/schemas/DeliveryArea" }
        deliveryNumber: { type: string }
        handoffReference: { type: string }
        id: { type: string, format: uuid }
        logisticsOrganizationId: { type: string, format: uuid }
        orderNumber: { type: string }
        pharmacyOrganizationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        updatedAt: { type: string, format: date-time }
    DeliverySummary:
      type: object
      additionalProperties: false
      required: [active, all, delivered, exception]
      properties:
        active: { type: integer, minimum: 0 }
        all: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0 }
        exception: { type: integer, minimum: 0 }
    DeliveryList:
      type: object
      additionalProperties: false
      required: [data, pageInfo, summary]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        summary: { $ref: "#/components/schemas/DeliverySummary" }
    MoneyTotal:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: string, pattern: "^-?[0-9]+$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    DashboardAttention:
      type: object
      additionalProperties: false
      required: [expiringCredentials, openComplaints, pendingApplications]
      properties:
        expiringCredentials: { type: integer, minimum: 0 }
        openComplaints: { type: integer, minimum: 0 }
        pendingApplications: { type: integer, minimum: 0 }
    DashboardCounts:
      type: object
      additionalProperties: false
      required:
        [activeDeliveries, appointmentsToday, laboratoryBookings, patients, verifiedPractitioners]
      properties:
        activeDeliveries: { type: integer, minimum: 0 }
        appointmentsToday: { type: integer, minimum: 0 }
        laboratoryBookings: { type: integer, minimum: 0 }
        patients: { type: integer, minimum: 0 }
        verifiedPractitioners: { type: integer, minimum: 0 }
    Dashboard:
      type: object
      additionalProperties: false
      required: [attention, counts, paymentVolume, recentAuditEvents, recentComplaints]
      properties:
        attention: { $ref: "#/components/schemas/DashboardAttention" }
        counts: { $ref: "#/components/schemas/DashboardCounts" }
        paymentVolume: { type: array, items: { $ref: "#/components/schemas/MoneyTotal" } }
        recentAuditEvents: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        recentComplaints: { type: array, items: { $ref: "#/components/schemas/Complaint" } }
    PractitionerVerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, SUSPENDED, REVOKED]
    PractitionerScope:
      type: string
      enum: [ALL, PENDING, VERIFIED, SUSPENDED, REVOKED]
    PractitionerListItem:
      type: object
      additionalProperties: false
      required:
        [
          createdAt,
          displayName,
          id,
          primaryProfession,
          primarySpecialty,
          updatedAt,
          verificationStatus,
          version,
        ]
      properties:
        createdAt: { type: string, format: date-time }
        displayName: { type: string }
        id: { type: string, format: uuid }
        primaryProfession: { type: [string, "null"] }
        primarySpecialty: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
        verificationStatus: { $ref: "#/components/schemas/PractitionerVerificationStatus" }
        version: { type: integer, minimum: 1 }
    PractitionerSummary:
      type: object
      additionalProperties: false
      required: [all, pending, revoked, suspended, verified]
      properties:
        all: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        revoked: { type: integer, minimum: 0 }
        suspended: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
    PractitionerList:
      type: object
      additionalProperties: false
      required: [data, pageInfo, summary]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PractitionerListItem" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        summary: { $ref: "#/components/schemas/PractitionerSummary" }
    PractitionerTaxonomy:
      type: object
      additionalProperties: false
      required: [id, isPrimary, name]
      properties:
        id: { type: string, format: uuid }
        isPrimary: { type: boolean }
        name: { type: string }
    PractitionerAffiliation:
      type: object
      additionalProperties: false
      required: [facilityName, id, organizationId, roleTitle]
      properties:
        facilityName: { type: string }
        id: { type: string, format: uuid }
        organizationId: { type: [string, "null"], format: uuid }
        roleTitle: { type: [string, "null"] }
    PractitionerCredential:
      type: object
      additionalProperties: false
      required:
        [
          credentialType,
          expiresAt,
          id,
          issuerName,
          jurisdictionCode,
          registrationNumber,
          verifiedAt,
        ]
      properties:
        credentialType: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
        id: { type: string, format: uuid }
        issuerName: { type: string }
        jurisdictionCode: { type: string }
        registrationNumber: { type: string }
        verifiedAt: { type: [string, "null"], format: date-time }
    PractitionerVerificationHistory:
      type: object
      additionalProperties: false
      required: [actorPrincipalId, fromStatus, id, note, occurredAt, reasonCode, toStatus]
      properties:
        actorPrincipalId: { type: string, format: uuid }
        fromStatus: { $ref: "#/components/schemas/PractitionerVerificationStatus" }
        id: { type: string, format: uuid }
        note: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
        reasonCode: { type: string }
        toStatus: { $ref: "#/components/schemas/PractitionerVerificationStatus" }
    PractitionerDetail:
      type: object
      additionalProperties: false
      required:
        [
          affiliations,
          approvedApplicationId,
          biography,
          consultationFees,
          createdAt,
          credentials,
          displayName,
          documents,
          headline,
          id,
          languages,
          primaryProfession,
          primarySpecialty,
          professions,
          serviceModes,
          specialties,
          updatedAt,
          verificationHistory,
          verificationStatus,
          version,
          yearsExperience,
        ]
      properties:
        createdAt: { type: string, format: date-time }
        displayName: { type: string }
        id: { type: string, format: uuid }
        primaryProfession: { type: [string, "null"] }
        primarySpecialty: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
        verificationStatus: { $ref: "#/components/schemas/PractitionerVerificationStatus" }
        version: { type: integer, minimum: 1 }
        affiliations:
          { type: array, items: { $ref: "#/components/schemas/PractitionerAffiliation" } }
        approvedApplicationId: { type: [string, "null"], format: uuid }
        biography: { type: [string, "null"] }
        consultationFees:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [amountMinor, currency, effectiveFrom, effectiveUntil, id, mode, status]
            properties:
              amountMinor: { type: string, pattern: "^[0-9]+$" }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
              effectiveFrom: { type: string, format: date-time }
              effectiveUntil: { type: [string, "null"], format: date-time }
              id: { type: string, format: uuid }
              mode: { type: string, enum: [VIDEO, AUDIO, CHAT, IN_PERSON, HOME_VISIT] }
              status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        credentials: { type: array, items: { $ref: "#/components/schemas/PractitionerCredential" } }
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [declaredContentType, declaredSizeBytes, id, originalFilename, purpose, status]
            properties:
              declaredContentType: { type: string }
              declaredSizeBytes: { type: integer, minimum: 1 }
              id: { type: string, format: uuid }
              originalFilename: { type: string }
              purpose: { type: string }
              status: { type: string }
        headline: { type: [string, "null"] }
        languages: { type: array, items: { type: string } }
        professions: { type: array, items: { $ref: "#/components/schemas/PractitionerTaxonomy" } }
        serviceModes:
          {
            type: array,
            items: { type: string, enum: [VIDEO, AUDIO, CHAT, IN_PERSON, HOME_VISIT] },
          }
        specialties: { type: array, items: { $ref: "#/components/schemas/PractitionerTaxonomy" } }
        verificationHistory:
          { type: array, items: { $ref: "#/components/schemas/PractitionerVerificationHistory" } }
        yearsExperience: { type: [integer, "null"], minimum: 0 }
    PractitionerTransitionInput:
