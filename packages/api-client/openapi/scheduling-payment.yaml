openapi: 3.1.0
info:
  title: Royal Palace Scheduling and Payment API
  version: 1.0.0
paths:
  /api/public/practitioners/{practitionerId}/availability:
    get:
      operationId: listPractitionerAvailability
      parameters:
        - $ref: "#/components/parameters/PractitionerId"
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Bounded open availability
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Availability" } }
  /api/appointments:
    post:
      operationId: bookAppointment
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [availabilitySlotId, intake]
              properties:
                availabilitySlotId: { type: string, format: uuid }
                intake:
                  type: object
                  additionalProperties: false
                  required: [consentEvidenceCode, reason]
                  properties:
                    consentEvidenceCode: { type: string, enum: [APPOINTMENT_INTAKE_V1] }
                    reason: { type: string, minLength: 3, maxLength: 500 }
                    symptoms: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Appointment reserved pending payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /api/appointments/{appointmentId}:
    get:
      operationId: getAppointment
      parameters:
        - { in: path, name: appointmentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized appointment view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /api/appointments/{appointmentId}/intake-consent/revoke:
    post:
      operationId: revokeAppointmentIntakeConsent
      parameters:
        - { in: path, name: appointmentId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Appointment intake consent revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /api/patient/appointments:
    get:
      operationId: listPatientAppointments
      parameters:
        - $ref: "#/components/parameters/AppointmentScope"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DayFrom"
        - $ref: "#/components/parameters/DayTo"
      responses:
        "200":
          description: Authenticated patient's bounded appointment list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientAppointmentList" }
  /api/patient/payments:
    get:
      operationId: listPatientPayments
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Authenticated patient's bounded payment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientPaymentList" }
  /api/provider/appointments:
    get:
      operationId: listProviderAppointments
      parameters:
        - $ref: "#/components/parameters/AppointmentScope"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DayFrom"
        - $ref: "#/components/parameters/DayTo"
        - { in: query, name: patientId, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Authenticated practitioner's bounded appointment list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderAppointmentList" }
  /api/provider/appointments/{appointmentId}:
    get:
      operationId: getProviderAppointment
      parameters:
        - { in: path, name: appointmentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Practitioner-owned appointment with minimal patient identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderAppointment" }
  /api/payments/checkout-sessions:
    post:
      operationId: createHostedCheckout
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentId]
              properties:
                paymentId: { type: string, format: uuid }
      responses:
        "201":
          description: Hosted checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostedCheckout" }
  /api/payments/{paymentId}/status:
    get:
      operationId: getPaymentStatus
      parameters:
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Patient-owned payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /api/provider/availability:
    post:
      operationId: createAvailability
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consultationFeeId, endsAt, practitionerId, startsAt]
              properties:
                consultationFeeId: { type: string, format: uuid }
                endsAt: { type: string, format: date-time }
                practitionerId: { type: string, format: uuid }
                startsAt: { type: string, format: date-time }
      responses:
        "201":
          description: Availability slot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
  /api/admin/practitioners/{practitionerId}/consultation-fees:
    post:
      operationId: createConsultationFee
      parameters:
        - $ref: "#/components/parameters/PractitionerId"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationFeeInput" }
      responses:
        "201":
          description: Draft administrator-governed fee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationFee" }
  /api/admin/consultation-fees/{feeId}/activate:
    post:
      operationId: activateConsultationFee
      parameters:
        - { in: path, name: feeId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Fee activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationFee" }
  /api/admin/service-prices:
    get:
      operationId: listServicePrices
      responses:
        "200":
          description: Governed service price catalogue
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServicePrice" }
    post:
      operationId: createServicePrice
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePriceInput" }
      responses:
        "201":
          description: Draft service price created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePrice" }
  /api/admin/service-prices/{priceId}/activate:
    post:
      operationId: activateServicePrice
      parameters:
        - { in: path, name: priceId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Service price activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePrice" }
  /api/admin/payments/{paymentId}/reconcile:
    post:
      operationId: reconcilePayment
      parameters:
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: Provider-authoritative reconciliation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
components:
  parameters:
    Csrf:
      in: header
      name: x-rp-csrf-token
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      in: header
      name: idempotency-key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    PractitionerId:
      in: path
      name: practitionerId
      required: true
      schema: { type: string, format: uuid }
    AppointmentScope:
      in: query
      name: scope
      required: true
      schema: { type: string, enum: [ALL, TODAY, UPCOMING, COMPLETED, UNSUCCESSFUL] }
    Cursor:
      in: query
      name: cursor
      schema: { type: string, minLength: 1, maxLength: 1024 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    DayFrom:
      in: query
      name: dayFrom
      schema: { type: string, format: date-time }
    DayTo:
      in: query
      name: dayTo
      schema: { type: string, format: date-time }
  schemas:
    Mode:
      type: string
      enum: [VIDEO, AUDIO, CHAT, IN_PERSON, HOME_VISIT]
    PaymentStatus:
      type: string
      enum:
        [
          CREATED,
          PENDING,
          SUCCEEDED,
          FAILED,
          EXPIRED,
          CANCELLED,
          REVERSED,
          PARTIALLY_REFUNDED,
          REFUNDED,
          DISPUTED,
        ]
    Availability:
      type: object
      additionalProperties: false
      required: [amountMinor, currency, endsAt, id, mode, practitionerId, startsAt]
      properties:
        amountMinor: { type: string, pattern: "^[0-9]+$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        endsAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        intake: { $ref: "#/components/schemas/AppointmentIntake" }
        mode: { $ref: "#/components/schemas/Mode" }
        practitionerId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
    Appointment:
      type: object
      additionalProperties: false
      required:
        [
          amountMinor,
          currency,
          endsAt,
          id,
          mode,
          paymentId,
          practitioner,
          startsAt,
          status,
          version,
        ]
      properties:
        amountMinor: { type: string, pattern: "^[0-9]+$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        endsAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/Mode" }
        paymentId: { type: string, format: uuid }
        practitioner:
          type: object
          additionalProperties: false
          required: [displayName, id]
          properties:
            displayName: { type: string }
            id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        status:
          {
            type: string,
            enum: [PENDING_PAYMENT, CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELLED, COMPLETED],
          }
        version: { type: integer, minimum: 1 }
    AppointmentIntake:
      type: object
      additionalProperties: false
      required: [consentedAt, consentStatus, reason, revokedAt, symptoms, version]
      properties:
        consentedAt: { type: string, format: date-time }
        consentStatus: { type: string, enum: [GRANTED, REVOKED] }
        reason: { type: [string, "null"] }
        revokedAt: { type: [string, "null"], format: date-time }
        symptoms: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
    ProviderAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          additionalProperties: false
          required: [patient]
          properties:
            patient:
              type: object
              additionalProperties: false
              required: [displayName, id]
              properties:
                displayName: { type: string }
                id: { type: string, format: uuid }
    PageInfo:
      type: object
      additionalProperties: false
      required: [endCursor, hasNextPage]
      properties:
        endCursor: { type: [string, "null"] }
        hasNextPage: { type: boolean }
    PatientAppointmentList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    ProviderAppointmentList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ProviderAppointment" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    HostedCheckout:
      type: object
      additionalProperties: false
      required: [checkoutUrl, expiresAt, paymentId, status]
      properties:
        checkoutUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        paymentId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/PaymentStatus" }
    Payment:
      type: object
      additionalProperties: false
      required:
        [
          amountMinor,
          appointmentId,
          currency,
          id,
          laboratoryBookingId,
          payableUntil,
          pharmacyOrderId,
          purpose,
          status,
          updatedAt,
        ]
      properties:
        amountMinor: { type: string, pattern: "^[0-9]+$" }
        appointmentId: { type: [string, "null"], format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        id: { type: string, format: uuid }
        laboratoryBookingId: { type: [string, "null"], format: uuid }
        payableUntil: { type: string, format: date-time }
        pharmacyOrderId: { type: [string, "null"], format: uuid }
        purpose: { type: string, enum: [CONSULTATION, PHARMACY_ORDER, LABORATORY_BOOKING] }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        updatedAt: { type: string, format: date-time }
    PatientPayment:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          additionalProperties: false
          required: [createdAt, reference, refundedAmountMinor]
          properties:
            createdAt: { type: string, format: date-time }
            reference: { type: string, minLength: 1, maxLength: 64 }
            refundedAmountMinor: { type: string, pattern: "^[0-9]+$" }
    PatientPaymentList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PatientPayment" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    ConsultationFeeInput:
      type: object
      additionalProperties: false
      required: [amountMinor, currency, effectiveFrom, mode]
      properties:
        amountMinor: { type: string, pattern: "^[0-9]+$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: string, format: date-time }
        mode: { $ref: "#/components/schemas/Mode" }
    ConsultationFee:
      type: object
      additionalProperties: false
      required:
        [
          amountMinor,
          currency,
          effectiveFrom,
          effectiveUntil,
          id,
          mode,
          practitionerId,
          status,
          version,
        ]
      properties:
        amountMinor: { type: string, pattern: "^[0-9]+$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/Mode" }
        practitionerId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        version: { type: integer, minimum: 1 }
    ServicePriceInput:
      type: object
      additionalProperties: false
      required: [currency, effectiveFrom, patientPriceMinor, providerPayoutMinor, serviceId]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: string, format: date-time }
        patientPriceMinor: { type: string, pattern: "^[0-9]+$" }
        providerPayoutMinor: { type: string, pattern: "^[0-9]+$" }
        serviceId: { type: string, format: uuid }
    ServicePrice:
      type: object
      additionalProperties: false
      required:
        [
          currency,
          effectiveFrom,
          effectiveUntil,
          id,
          patientPriceMinor,
          providerPayoutMinor,
          service,
          status,
          version,
        ]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        id: { type: string, format: uuid }
        patientPriceMinor: { type: string, pattern: "^[0-9]+$" }
        providerPayoutMinor: { type: string, pattern: "^[0-9]+$" }
        service:
          type: object
          additionalProperties: false
          required: [category, code, id, name]
          properties:
            category: { type: string }
            code: { type: string }
            id: { type: string, format: uuid }
            name: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        version: { type: integer, minimum: 1 }
    Reconciliation:
      type: object
      additionalProperties: false
      required: [applied, internalStatus, paymentId, providerStatus, result]
      properties:
        applied: { type: boolean }
        internalStatus: { $ref: "#/components/schemas/PaymentStatus" }
        paymentId: { type: string, format: uuid }
        providerStatus: { $ref: "#/components/schemas/PaymentStatus" }
        result: { type: string, enum: [MATCHED, MISMATCH_APPLIED, MISMATCH_UNRESOLVED] }
