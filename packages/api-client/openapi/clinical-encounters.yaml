openapi: 3.1.0
info:
  title: Royal Palace Clinical Encounter API
  version: 1.0.0
servers:
  - url: /
paths:
  /v1/provider/clinical-encounters:
    get:
      operationId: listProviderClinicalEncounters
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          $ref: "#/components/responses/EncounterList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: openClinicalEncounter
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [appointmentId]
              properties:
                appointmentId:
                  type: string
                  format: uuid
      responses:
        "201":
          $ref: "#/components/responses/Encounter"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/provider/clinical-encounters/patients:
    get:
      operationId: listProviderClinicalPatients
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: q
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/ProviderPatientRosterList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/provider/clinical-encounters/referrals:
    get:
      operationId: listProviderClinicalReferrals
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: direction
          required: true
          schema: { type: string, enum: [RECEIVED, SENT] }
      responses:
        "200": { $ref: "#/components/responses/ProviderReferralList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/provider/clinical-encounters/referrals/{referralId}/decision:
    post:
      operationId: decideProviderClinicalReferral
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: path
          name: referralId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, expectedVersion]
              properties:
                decision: { type: string, enum: [ACCEPTED, DECLINED] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated referral
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderReferral" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/provider/clinical-encounters/{encounterId}:
    get:
      operationId: getProviderClinicalEncounter
      parameters:
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "200":
          $ref: "#/components/responses/Encounter"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/provider/clinical-encounters/{encounterId}/drafts:
    post:
      operationId: saveClinicalEncounterDraft
      parameters:
        - $ref: "#/components/parameters/EncounterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Draft"
      responses:
        "201":
          $ref: "#/components/responses/Encounter"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/provider/clinical-encounters/{encounterId}/sign:
    post:
      operationId: signClinicalEncounter
      parameters:
        - $ref: "#/components/parameters/EncounterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Sign"
      responses:
        "201":
          $ref: "#/components/responses/Encounter"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/provider/clinical-encounters/{encounterId}/addenda:
    post:
      operationId: addClinicalEncounterAddendum
      parameters:
        - $ref: "#/components/parameters/EncounterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Addendum"
      responses:
        "201":
          $ref: "#/components/responses/Encounter"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/provider/clinical-encounters/{encounterId}/related-actions:
    post:
      operationId: createClinicalEncounterRelatedAction
      parameters:
        - $ref: "#/components/parameters/EncounterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelatedActionInput"
      responses:
        "201":
          $ref: "#/components/responses/Encounter"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/patient/clinical-encounters:
    get:
      operationId: listPatientClinicalEncounters
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/EncounterList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/patient/clinical-encounters/{encounterId}:
    get:
      operationId: getPatientClinicalEncounter
      parameters:
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "200":
          $ref: "#/components/responses/Encounter"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/patient/clinical-encounters/by-appointment/{appointmentId}:
    get:
      operationId: getPatientClinicalEncounterByAppointment
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          $ref: "#/components/responses/Encounter"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 1024
    EncounterId:
      in: path
      name: encounterId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PatientId:
      in: query
      name: patientId
      schema:
        type: string
        format: uuid
  requestBodies:
    Draft:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DraftInput"
    Sign:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignInput"
    Addendum:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddendumInput"
  responses:
    Encounter:
      description: Clinical encounter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClinicalEncounter"
    EncounterList:
      description: Bounded clinical encounter page
      content:
        application/json:
          schema:
            type: object
            required: [data, pageInfo]
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/ClinicalEncounter"
              pageInfo:
                $ref: "#/components/schemas/PageInfo"
    ProviderPatientRosterList:
      description: Privacy-minimized provider patient roster page
      content:
        application/json:
          schema:
            type: object
            required: [data, pageInfo]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/ProviderPatientRosterItem" }
              pageInfo: { $ref: "#/components/schemas/PageInfo" }
    ProviderReferralList:
      description: Provider referral page scoped to the authenticated practitioner
      content:
        application/json:
          schema:
            type: object
            required: [data, pageInfo]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/ProviderReferral" }
              pageInfo: { $ref: "#/components/schemas/PageInfo" }
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Documentation:
      type: object
      additionalProperties: false
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [code, title, text]
            properties:
              code: { type: string, maxLength: 100 }
              title: { type: string, maxLength: 200 }
              text: { type: string, maxLength: 20000 }
    NoteBaseInput:
      type: object
      required: [documentation, expectedLatestRevision, schemaVersion]
      properties:
        documentation:
          $ref: "#/components/schemas/Documentation"
        expectedLatestRevision: { type: integer, minimum: 0 }
        schemaVersion: { type: integer, enum: [1] }
    DraftInput:
      allOf:
        - $ref: "#/components/schemas/NoteBaseInput"
      unevaluatedProperties: false
    DiagnosisInput:
      type: object
      additionalProperties: false
      required: [display, status, type]
      properties:
        code: { type: string, maxLength: 100 }
        codeSystem: { type: string, maxLength: 255 }
        display: { type: string, maxLength: 500 }
        onsetAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, RESOLVED, ENTERED_IN_ERROR] }
        type: { type: string, enum: [PRIMARY, SECONDARY, DIFFERENTIAL, PROVISIONAL] }
    ObservationInput:
      oneOf:
        - $ref: "#/components/schemas/QuantityObservationInput"
        - $ref: "#/components/schemas/TextObservationInput"
        - $ref: "#/components/schemas/CodedObservationInput"
        - $ref: "#/components/schemas/BooleanObservationInput"
    ObservationBaseInput:
      type: object
      required: [code, display, observedAt, valueType]
      properties:
        code: { type: string, maxLength: 100 }
        codeSystem: { type: string, maxLength: 255 }
        display: { type: string, maxLength: 200 }
        observedAt: { type: string, format: date-time }
        unitCode: { type: string, maxLength: 100 }
        valueType: { type: string, enum: [QUANTITY, TEXT, CODED, BOOLEAN] }
    QuantityObservationInput:
      allOf:
        - $ref: "#/components/schemas/ObservationBaseInput"
        - type: object
          required: [numericValue]
          properties:
            numericValue: { type: string, pattern: "^-?\\d{1,12}(?:\\.\\d{1,6})?$" }
            valueType: { type: string, enum: [QUANTITY] }
      unevaluatedProperties: false
    TextObservationInput:
      allOf:
        - $ref: "#/components/schemas/ObservationBaseInput"
        - type: object
          required: [textValue]
          properties:
            textValue: { type: string, maxLength: 1000 }
            valueType: { type: string, enum: [TEXT] }
      unevaluatedProperties: false
    CodedObservationInput:
      allOf:
        - $ref: "#/components/schemas/ObservationBaseInput"
        - type: object
          required: [codedValue]
          properties:
            codedValue: { type: string, maxLength: 255 }
            valueType: { type: string, enum: [CODED] }
      unevaluatedProperties: false
    BooleanObservationInput:
      allOf:
        - $ref: "#/components/schemas/ObservationBaseInput"
        - type: object
          required: [booleanValue]
          properties:
            booleanValue: { type: boolean }
            valueType: { type: string, enum: [BOOLEAN] }
      unevaluatedProperties: false
    SignInput:
      allOf:
        - $ref: "#/components/schemas/NoteBaseInput"
        - type: object
          required: [diagnoses, expectedVersion, observations]
          properties:
            diagnoses:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: "#/components/schemas/DiagnosisInput" }
            expectedVersion: { type: integer, minimum: 1 }
            observations:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/ObservationInput" }
      unevaluatedProperties: false
    AddendumInput:
      allOf:
        - $ref: "#/components/schemas/NoteBaseInput"
        - type: object
          required: [diagnoses, observations, supersedesNoteId]
          properties:
            diagnoses:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/DiagnosisInput" }
            observations:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/ObservationInput" }
            supersedesNoteId: { type: string, format: uuid }
      unevaluatedProperties: false
    RelatedActionInput:
      oneOf:
        - $ref: "#/components/schemas/ReferralInput"
        - $ref: "#/components/schemas/CarePlanInput"
        - $ref: "#/components/schemas/AllergyInput"
        - $ref: "#/components/schemas/AttachmentReferenceInput"
    ReferralInput:
      type: object
      additionalProperties: false
      required: [kind, priority, reason, specialtyCode]
      properties:
        kind: { type: string, enum: [REFERRAL] }
        priority: { type: string, enum: [ROUTINE, URGENT, EMERGENCY] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        recipientName: { type: string, minLength: 1, maxLength: 200 }
        recipientPractitionerId: { type: string, format: uuid }
        specialtyCode: { type: string, minLength: 1, maxLength: 120 }
    CarePlanInput:
      type: object
      additionalProperties: false
      required: [activities, goal, kind, startsAt, title]
      properties:
        activities:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 500 }
        endsAt: { type: string, format: date-time }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        kind: { type: string, enum: [CARE_PLAN] }
        startsAt: { type: string, format: date-time }
        title: { type: string, minLength: 1, maxLength: 200 }
    AllergyInput:
      type: object
      additionalProperties: false
      required: [criticality, kind, substanceDisplay]
      properties:
        criticality: { type: string, enum: [LOW, HIGH, UNABLE_TO_ASSESS] }
        kind: { type: string, enum: [ALLERGY] }
        reaction: { type: string, minLength: 1, maxLength: 1000 }
        substanceCode: { type: string, minLength: 1, maxLength: 120 }
        substanceCodeSystem: { type: string, minLength: 1, maxLength: 255 }
        substanceDisplay: { type: string, minLength: 1, maxLength: 300 }
    AttachmentReferenceInput:
      type: object
      additionalProperties: false
      required: [kind, purpose, sourceId, sourceType]
      properties:
        kind: { type: string, enum: [ATTACHMENT_REFERENCE] }
        purpose: { type: string, minLength: 1, maxLength: 80 }
        sourceId: { type: string, format: uuid }
        sourceType:
          type: string
          enum: [LABORATORY_RESULT_ATTACHMENT, SCANNED_PRESCRIPTION, APPLICATION_DOCUMENT]
    ClinicalEncounter:
      type: object
      required:
        [
          appointmentId,
          encounterNumber,
          id,
          notes,
          openedAt,
          patient,
          practitioner,
          relatedActions,
          signedAt,
          status,
          updatedAt,
          version,
        ]
      properties:
        appointmentId: { type: string, format: uuid }
        encounterNumber: { type: string }
        id: { type: string, format: uuid }
        notes:
          type: array
          items: { $ref: "#/components/schemas/ClinicalNote" }
        openedAt: { type: string, format: date-time }
        patient: { $ref: "#/components/schemas/Party" }
        practitioner: { $ref: "#/components/schemas/Party" }
        relatedActions: { $ref: "#/components/schemas/ClinicalRelatedActions" }
        signedAt: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [OPEN, SIGNED] }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    ClinicalRelatedActions:
      type: object
      additionalProperties: false
      required:
        [
          allergies,
          attachmentReferences,
          carePlans,
          laboratoryRequestIds,
          prescriptionIds,
          referrals,
        ]
      properties:
        allergies:
          type: array
          items: { $ref: "#/components/schemas/ClinicalAllergy" }
        attachmentReferences:
          type: array
          items: { $ref: "#/components/schemas/ClinicalAttachmentReference" }
        carePlans:
          type: array
          items: { $ref: "#/components/schemas/ClinicalCarePlan" }
        laboratoryRequestIds:
          type: array
          items: { type: string, format: uuid }
        prescriptionIds:
          type: array
          items: { type: string, format: uuid }
        referrals:
          type: array
          items: { $ref: "#/components/schemas/ClinicalReferral" }
    ClinicalReferral:
      type: object
      additionalProperties: false
      required: [createdAt, id, priority, reason, recipientName, specialtyCode, status, version]
      properties:
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        priority: { type: string, enum: [ROUTINE, URGENT, EMERGENCY] }
        reason: { type: string }
        recipientName: { type: [string, "null"] }
        specialtyCode: { type: string }
        status: { type: string, enum: [ACTIVE, ACCEPTED, DECLINED, COMPLETED, CANCELLED] }
        version: { type: integer }
    ProviderPatientRosterItem:
      type: object
      additionalProperties: false
      required: [encounterCount, id, lastEncounterAt, name]
      properties:
        encounterCount: { type: integer, minimum: 1 }
        id: { type: string, format: uuid }
        lastEncounterAt: { type: string, format: date-time }
        name: { type: string }
    ProviderReferral:
      type: object
      additionalProperties: false
      required:
        [
          createdAt,
          id,
          patient,
          priority,
          reason,
          recipient,
          recipientName,
          sender,
          specialtyCode,
          status,
          version,
        ]
      properties:
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        patient: { $ref: "#/components/schemas/Party" }
        priority: { type: string, enum: [ROUTINE, URGENT, EMERGENCY] }
        reason: { type: string }
        recipient:
          oneOf:
            - $ref: "#/components/schemas/Party"
            - type: "null"
        recipientName: { type: [string, "null"] }
        sender: { $ref: "#/components/schemas/Party" }
        specialtyCode: { type: string }
        status: { type: string, enum: [ACTIVE, ACCEPTED, DECLINED, COMPLETED, CANCELLED] }
        version: { type: integer }
    ClinicalCarePlan:
      type: object
      additionalProperties: false
      required: [activities, endsAt, goal, id, startsAt, status, title, updatedAt, version]
      properties:
        activities: { type: array, items: { type: string } }
        endsAt: { type: [string, "null"], format: date-time }
        goal: { type: string }
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        title: { type: string }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    ClinicalAllergy:
      type: object
      additionalProperties: false
      required:
        [
          criticality,
          id,
          reaction,
          recordedAt,
          status,
          substanceCode,
          substanceCodeSystem,
          substanceDisplay,
          version,
        ]
      properties:
        criticality: { type: string, enum: [LOW, HIGH, UNABLE_TO_ASSESS] }
        id: { type: string, format: uuid }
        reaction: { type: [string, "null"] }
        recordedAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, RESOLVED, ENTERED_IN_ERROR] }
        substanceCode: { type: [string, "null"] }
        substanceCodeSystem: { type: [string, "null"] }
        substanceDisplay: { type: string }
        version: { type: integer }
    ClinicalAttachmentReference:
      type: object
      additionalProperties: false
      required: [createdAt, id, purpose, sourceId, sourceType]
      properties:
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        purpose: { type: string }
        sourceId: { type: string, format: uuid }
        sourceType:
          type: string
          enum: [LABORATORY_RESULT_ATTACHMENT, SCANNED_PRESCRIPTION, APPLICATION_DOCUMENT]
    ClinicalNote:
      type: object
      required:
        [
          authoredAt,
          contentHash,
          diagnoses,
          documentation,
          id,
          kind,
          observations,
          revision,
          schemaVersion,
          signedAt,
          supersedesNoteId,
        ]
      properties:
        authoredAt: { type: string, format: date-time }
        contentHash: { type: string }
        diagnoses:
          type: array
          items: { $ref: "#/components/schemas/ClinicalDiagnosis" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        id: { type: string, format: uuid }
        kind: { type: string, enum: [DRAFT, SIGNED, ADDENDUM] }
        observations:
          type: array
          items: { $ref: "#/components/schemas/ClinicalObservation" }
        revision: { type: integer }
        schemaVersion: { type: integer }
        signedAt: { type: [string, "null"], format: date-time }
        supersedesNoteId: { type: [string, "null"], format: uuid }
    ClinicalDiagnosis:
      type: object
      additionalProperties: false
      required: [code, codeSystem, display, id, onsetAt, recordedAt, status, type]
      properties:
        code: { type: [string, "null"] }
        codeSystem: { type: [string, "null"] }
        display: { type: string }
        id: { type: string, format: uuid }
        onsetAt: { type: [string, "null"], format: date-time }
        recordedAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, RESOLVED, ENTERED_IN_ERROR] }
        type: { type: string, enum: [PRIMARY, SECONDARY, DIFFERENTIAL, PROVISIONAL] }
    ClinicalObservation:
      type: object
      additionalProperties: false
      required:
        [
          booleanValue,
          code,
          codedValue,
          codeSystem,
          display,
          id,
          numericValue,
          observedAt,
          textValue,
          unitCode,
          valueType,
        ]
      properties:
        booleanValue: { type: [boolean, "null"] }
        code: { type: string }
        codedValue: { type: [string, "null"] }
        codeSystem: { type: [string, "null"] }
        display: { type: string }
        id: { type: string, format: uuid }
        numericValue: { type: [string, "null"] }
        observedAt: { type: string, format: date-time }
        textValue: { type: [string, "null"] }
        unitCode: { type: [string, "null"] }
        valueType: { type: string, enum: [QUANTITY, TEXT, CODED, BOOLEAN] }
    Party:
      type: object
      required: [displayName, id]
      properties:
        displayName: { type: string }
        id: { type: string, format: uuid }
    PageInfo:
      type: object
      required: [endCursor, hasNextPage]
      properties:
        endCursor: { type: [string, "null"] }
