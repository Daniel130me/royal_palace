openapi: 3.1.0
info:
  title: Royal Palace Laboratory API
  version: 1.0.0
  description: >-
    Synthetic-only laboratory request, patient routing, and laboratory operations contract.
    Browser clients use authenticated same-origin backend-for-frontend routes.
paths:
  /v1/provider/laboratory-requests:
    get:
      operationId: listPractitionerLaboratoryRequests
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { in: query, name: patientId, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Issuer-scoped requests,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryRequestList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
    post:
      operationId: createLaboratoryRequest
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CreateLaboratoryRequestInput" } },
          }
      responses:
        "201":
          {
            description: Laboratory request created,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryRequest" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/patient/laboratory-requests:
    get:
      operationId: listPatientLaboratoryRequests
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          {
            description: Patient-owned requests,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryRequestList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /v1/patient/laboratory-requests/{requestId}/bookings:
    post:
      operationId: bookLaboratoryRequest
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/LaboratoryRequestId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/BookLaboratoryRequestInput" } },
          }
      responses:
        "201":
          {
            description: Laboratory booking created,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryRequest" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory-requests/{requestId}:
    get:
      operationId: getLaboratoryRequest
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/LaboratoryRequestId" }
      responses:
        "200":
          {
            description: Relationship-scoped request,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryRequest" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/laboratory/bookings:
    get:
      operationId: listLaboratoryBookings
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/LaboratoryBookingStatus" },
          }
      responses:
        "200":
          {
            description: Exact-organization laboratory queue,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/LaboratoryQueueList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /v1/laboratory/bookings/{bookingId}/transitions:
    post:
      operationId: transitionLaboratoryBooking
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/TransitionLaboratoryBookingInput" } },
          }
      responses:
        "200":
          {
            description: Booking transitioned,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryQueueRequest" } },
              },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/bookings/{bookingId}:
    get:
      operationId: getLaboratoryBooking
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Organization-scoped booking detail,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryQueueRequest" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/laboratory/results:
    get:
      operationId: listLaboratoryResults
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/LaboratoryResultStatus" },
          }
      responses:
        "200":
          {
            description: Organization-scoped results,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/LaboratoryResultList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
    post:
      operationId: createLaboratoryResultDraft
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateLaboratoryResultInput" } },
            },
        }
      responses:
        "201":
          {
            description: Result draft created,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}:
    get:
      operationId: getLaboratoryResult
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/ResultId" }
      responses:
        "200":
          {
            description: Relationship-scoped result,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/laboratory/results/{resultId}/draft:
    patch:
      operationId: updateLaboratoryResultDraft
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/ResultId" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UpdateLaboratoryResultInput" } },
            },
        }
      responses:
        "200":
          {
            description: Result draft updated,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}/review-transitions:
    post:
      operationId: transitionLaboratoryResultReview
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/ResultId" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/TransitionLaboratoryResultInput" } },
            },
        }
      responses:
        "200":
          {
            description: Review state transitioned,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}/publications:
    post:
      operationId: publishLaboratoryResult
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/ResultId" }
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/VersionInput" } } },
        }
      responses:
        "200":
          {
            description: Result published,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}/amendments:
    post:
      operationId: createLaboratoryResultAmendment
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/ResultId" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LaboratoryResultContentInput" } },
            },
        }
      responses:
        "201":
          {
            description: Amendment draft created,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}/attachment-upload-intents:
    post:
      operationId: createLaboratoryResultAttachmentUploadIntent
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/ResultId" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateLaboratoryResultAttachmentInput" } },
            },
        }
      responses:
        "201":
          {
            description: Quarantine upload intent created,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/LaboratoryResultAttachmentUploadIntent" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}/attachments/{attachmentId}/complete:
    post:
      operationId: completeLaboratoryResultAttachmentUpload
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/ResultId" }
        - { $ref: "#/components/parameters/AttachmentId" }
      responses:
        "200":
          {
            description: Upload evidence accepted for scanning,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryResultAttachmentCompletion" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/laboratory/results/{resultId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadLaboratoryResultAttachment
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/ResultId" },
          { $ref: "#/components/parameters/AttachmentId" },
        ]
      responses:
        "200":
          {
            description: Short-lived clean-object download,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SignedDownload" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/patient/laboratory-results:
    get:
      operationId: listPatientLaboratoryResults
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        "200":
          {
            description: Patient-owned published results,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/LaboratoryResultList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /v1/patient/laboratory-results/{resultId}:
    get:
      operationId: getPatientLaboratoryResult
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/ResultId" },
        ]
      responses:
        "200":
          {
            description: Patient-owned published result,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/patient/laboratory-results/{resultId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadPatientLaboratoryResultAttachment
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/ResultId" },
          { $ref: "#/components/parameters/AttachmentId" },
        ]
      responses:
        "200":
          {
            description: Patient-owned clean attachment download,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SignedDownload" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/provider/laboratory-results:
    get:
      operationId: listPractitionerLaboratoryResults
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        "200":
          {
            description: Practitioner-owned published results,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/LaboratoryResultList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /v1/provider/laboratory-results/{resultId}:
    get:
      operationId: getPractitionerLaboratoryResult
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/ResultId" },
        ]
      responses:
        "200":
          {
            description: Practitioner-owned published result,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LaboratoryResult" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/provider/laboratory-results/{resultId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadPractitionerLaboratoryResultAttachment
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/ResultId" },
          { $ref: "#/components/parameters/AttachmentId" },
        ]
      responses:
        "200":
          {
            description: Practitioner-owned clean attachment download,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SignedDownload" } } },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/provider/laboratory-critical-results:
    get:
      operationId: listPractitionerCriticalLaboratoryResults
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/LaboratoryCriticalResultStatus" },
          }
      responses:
        "200":
          {
            description: Practitioner-owned critical-result alerts,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryCriticalResultList" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /v1/provider/laboratory-critical-results/{criticalResultId}/acknowledgements:
    post:
      operationId: acknowledgeCriticalLaboratoryResult
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/CriticalResultId" },
        ]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/VersionInput" } } },
        }
      responses:
        "200":
          {
            description: Critical result acknowledged,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryCriticalResult" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/provider/laboratory-critical-results/{criticalResultId}/resolutions:
    post:
      operationId: resolveCriticalLaboratoryResult
      parameters:
        [
          { $ref: "#/components/parameters/RequestId" },
          { $ref: "#/components/parameters/CriticalResultId" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ResolveCriticalLaboratoryResultInput" } },
            },
        }
      responses:
        "200":
          {
            description: Critical result resolved,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LaboratoryCriticalResult" } },
              },
          }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  parameters:
    RequestId:
      {
        in: header,
        name: x-request-id,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    OrganizationId:
      {
        in: header,
        name: x-organization-id,
        required: true,
        schema: { type: string, format: uuid },
      }
    IdempotencyKey:
      {
        in: header,
        name: Idempotency-Key,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" },
      }
    Cursor: { in: query, name: cursor, schema: { type: string, minLength: 1, maxLength: 1024 } }
    Limit:
      { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
    LaboratoryRequestId:
      { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
    ResultId: { in: path, name: resultId, required: true, schema: { type: string, format: uuid } }
    CriticalResultId:
      { in: path, name: criticalResultId, required: true, schema: { type: string, format: uuid } }
    AttachmentId:
      { in: path, name: attachmentId, required: true, schema: { type: string, format: uuid } }
  responses:
    InvalidRequest: { description: Invalid request }
    AccessDenied: { description: Access denied }
    Conflict: { description: Concurrent or invariant conflict }
    NotFound: { description: Resource not found }
  schemas:
    CursorPageInfo:
      type: object
      additionalProperties: false
      required: [endCursor, hasNextPage]
      properties:
        endCursor: { type: [string, "null"] }
        hasNextPage: { type: boolean }
    NamedResource:
      type: object
      additionalProperties: false
      required: [displayName, id]
      properties:
        displayName: { type: string }
        id: { type: string, format: uuid }
    ServiceResource:
      type: object
      additionalProperties: false
      required: [code, id, name]
      properties:
        code: { type: string }
        id: { type: string, format: uuid }
        name: { type: string }
    LaboratoryRequestStatus: { type: string, enum: [ACTIVE, CANCELLED, COMPLETED] }
    LaboratoryBookingStatus:
      {
        type: string,
        enum:
          [
            CONFIRMED,
            SAMPLE_COLLECTION_PENDING,
            SAMPLE_COLLECTED,
            PROCESSING,
            RESULT_READY,
            COMPLETED,
            CANCELLED,
          ],
      }
    LaboratoryResultStatus: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, SUPERSEDED] }
    LaboratoryResultFlag: { type: string, enum: [NORMAL, LOW, HIGH, ABNORMAL, CRITICAL] }
    LaboratoryCriticalResultStatus:
      { type: string, enum: [OPEN, ACKNOWLEDGED, ESCALATED, RESOLVED] }
    LaboratoryRequestPriority: { type: string, enum: [ROUTINE, URGENT] }
    RequestStatusHistory:
      type: object
      additionalProperties: false
      required: [fromStatus, id, occurredAt, reasonCode, toStatus]
      properties:
        fromStatus:
          { oneOf: [{ $ref: "#/components/schemas/LaboratoryRequestStatus" }, { type: "null" }] }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        reasonCode: { type: string }
        toStatus: { $ref: "#/components/schemas/LaboratoryRequestStatus" }
    BookingStatusHistory:
      type: object
      additionalProperties: false
      required: [fromStatus, id, occurredAt, reasonCode, toStatus]
      properties:
        fromStatus:
          { oneOf: [{ $ref: "#/components/schemas/LaboratoryBookingStatus" }, { type: "null" }] }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        reasonCode: { type: string }
        toStatus: { $ref: "#/components/schemas/LaboratoryBookingStatus" }
    LaboratoryBooking:
      type: object
      additionalProperties: false
      required:
        [
          acceptedAt,
          bookingNumber,
          cancelledAt,
          completedAt,
          id,
          laboratory,
          processingStartedAt,
          resultReadyAt,
          sampleCollectedAt,
          scheduledAt,
          status,
          statusHistory,
          updatedAt,
          version,
        ]
      properties:
        acceptedAt: { type: string, format: date-time }
        bookingNumber: { type: string }
        cancelledAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        id: { type: string, format: uuid }
        laboratory: { $ref: "#/components/schemas/NamedResource" }
        processingStartedAt: { type: [string, "null"], format: date-time }
        resultReadyAt: { type: [string, "null"], format: date-time }
        sampleCollectedAt: { type: [string, "null"], format: date-time }
        scheduledAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/LaboratoryBookingStatus" }
        statusHistory: { type: array, items: { $ref: "#/components/schemas/BookingStatusHistory" } }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    LaboratoryRequestBase:
      type: object
      additionalProperties: false
      required:
        [
          bookings,
          cancelledAt,
          clinicalIndication,
          completedAt,
          createdAt,
          id,
          orderedAt,
          patient,
          practitioner,
          priority,
          requestNumber,
          service,
          specimenInstructions,
          status,
          updatedAt,
          version,
        ]
      properties:
        bookings: { type: array, items: { $ref: "#/components/schemas/LaboratoryBooking" } }
        cancelledAt: { type: [string, "null"], format: date-time }
        clinicalIndication: { type: string }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        orderedAt: { type: string, format: date-time }
        patient: { $ref: "#/components/schemas/NamedResource" }
        practitioner: { $ref: "#/components/schemas/NamedResource" }
        priority: { $ref: "#/components/schemas/LaboratoryRequestPriority" }
        requestNumber: { type: string }
        service: { $ref: "#/components/schemas/ServiceResource" }
        specimenInstructions: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/LaboratoryRequestStatus" }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    LaboratoryRequest:
      allOf:
        - { $ref: "#/components/schemas/LaboratoryRequestBase" }
        - type: object
          required: [appointmentId, statusHistory]
          properties:
            appointmentId: { type: string, format: uuid }
            statusHistory:
              { type: array, items: { $ref: "#/components/schemas/RequestStatusHistory" } }
    LaboratoryQueueRequest:
      description: Laboratory view omits consultation linkage and request history.
      $ref: "#/components/schemas/LaboratoryRequestBase"
    LaboratoryRequestList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/LaboratoryRequest" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    LaboratoryQueueList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/LaboratoryQueueRequest" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    CreateLaboratoryRequestInput:
      type: object
      additionalProperties: false
      required: [appointmentId, clinicalIndication, patientId, serviceId]
      properties:
        appointmentId: { type: string, format: uuid }
        clinicalIndication: { type: string, minLength: 1, maxLength: 2000 }
        patientId: { type: string, format: uuid }
        priority: { $ref: "#/components/schemas/LaboratoryRequestPriority" }
        serviceId: { type: string, format: uuid }
        specimenInstructions: { type: string, minLength: 1, maxLength: 1000 }
    BookLaboratoryRequestInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, laboratoryOrganizationId]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        laboratoryOrganizationId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
    TransitionLaboratoryBookingInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode, toStatus]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reasonCode:
          {
            type: string,
            enum:
              [
                collection_arranged,
                sample_collected,
                processing_started,
                patient_cancelled,
                laboratory_cancelled,
                sample_invalid,
              ],
          }
        toStatus:
          {
            type: string,
            enum: [SAMPLE_COLLECTION_PENDING, SAMPLE_COLLECTED, PROCESSING, CANCELLED],
          }
    LaboratoryResultComponentInput:
      type: object
      additionalProperties: false
      required: [flag, name, value]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        codeSystem: { type: string, minLength: 1, maxLength: 255 }
        flag: { $ref: "#/components/schemas/LaboratoryResultFlag" }
        name: { type: string, minLength: 1, maxLength: 255 }
        note: { type: string, minLength: 1, maxLength: 1000 }
        referenceRange: { type: string, minLength: 1, maxLength: 255 }
        unit: { type: string, minLength: 1, maxLength: 64 }
        value: { type: string, minLength: 1, maxLength: 1000 }
    LaboratoryResultContentInput:
      type: object
      additionalProperties: false
      required: [components]
      properties:
        components:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: "#/components/schemas/LaboratoryResultComponentInput" },
          }
        interpretation: { type: string, minLength: 1, maxLength: 4000 }
    CreateLaboratoryResultInput:
      allOf:
        - { $ref: "#/components/schemas/LaboratoryResultContentInput" }
        - type: object
          required: [bookingId]
          properties: { bookingId: { type: string, format: uuid } }
    UpdateLaboratoryResultInput:
      allOf:
        - { $ref: "#/components/schemas/LaboratoryResultContentInput" }
        - type: object
          required: [expectedVersion]
          properties: { expectedVersion: { type: integer, minimum: 1 } }
    TransitionLaboratoryResultInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode, toStatus]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [submitted_for_review, returned_for_correction] }
        toStatus: { type: string, enum: [DRAFT, IN_REVIEW] }
    VersionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    ResolveCriticalLaboratoryResultInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, resolutionCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        resolutionCode: { type: string, minLength: 1, maxLength: 128 }
    LaboratoryResultComponent:
      allOf:
        - { $ref: "#/components/schemas/LaboratoryResultComponentInput" }
        - type: object
          required: [code, codeSystem, id, lineNumber, note, referenceRange, unit]
          properties:
            code: { type: [string, "null"] }
            codeSystem: { type: [string, "null"] }
            id: { type: string, format: uuid }
            lineNumber: { type: integer, minimum: 1 }
            note: { type: [string, "null"] }
            referenceRange: { type: [string, "null"] }
            unit: { type: [string, "null"] }
    LaboratoryResultAttachment:
      type: object
      additionalProperties: false
      required: [id, originalFilename, purpose, status]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        purpose: { type: string }
        status: { type: string, enum: [AWAITING_UPLOAD, QUARANTINED, SCANNING, CLEAN, REJECTED] }
    CreateLaboratoryResultAttachmentInput:
      type: object
      additionalProperties: false
      required: [declaredContentType, declaredSha256, declaredSizeBytes, originalFilename, purpose]
      properties:
        declaredContentType:
          { type: string, enum: [application/pdf, image/heic, image/heif, image/jpeg, image/png] }
        declaredSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        declaredSizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        originalFilename: { type: string, minLength: 1, maxLength: 255 }
        purpose: { type: string, pattern: "^[a-z][a-z0-9_]{2,79}$" }
    LaboratoryResultAttachmentUploadIntent:
      type: object
      additionalProperties: false
      required: [attachmentId, upload]
      properties:
        attachmentId: { type: string, format: uuid }
        upload:
          type: object
          additionalProperties: false
          required: [expiresAt, headers, method, url]
          properties:
            expiresAt: { type: string, format: date-time }
            headers: { type: object, additionalProperties: { type: string } }
            method: { type: string, const: PUT }
            url: { type: string, format: uri }
    LaboratoryResultAttachmentCompletion:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { type: string, const: QUARANTINED } }
    SignedDownload:
      type: object
      additionalProperties: false
      required: [expiresAt, url]
      properties:
        expiresAt: { type: string, format: date-time }
        url: { type: string, format: uri }
    LaboratoryCriticalResult:
      type: object
      additionalProperties: false
      required:
        [
          acknowledgementDueAt,
          acknowledgedAt,
          componentId,
          escalatedAt,
          id,
          resolutionCode,
          resolvedAt,
          resultId,
          status,
          version,
        ]
      properties:
        acknowledgementDueAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, "null"], format: date-time }
        componentId: { type: string, format: uuid }
        escalatedAt: { type: [string, "null"], format: date-time }
        id: { type: string, format: uuid }
        resolutionCode: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"], format: date-time }
        resultId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LaboratoryCriticalResultStatus" }
        version: { type: integer, minimum: 1 }
    LaboratoryResult:
      type: object
      additionalProperties: false
      required:
        [
          attachments,
          bookingId,
          components,
          createdAt,
          criticalResults,
          id,
          interpretation,
          laboratory,
          patient,
          practitioner,
          previousResultId,
          publishedAt,
          resultNumber,
          service,
          status,
          summaryFlag,
          updatedAt,
          verifiedAt,
          version,
        ]
      properties:
        attachments:
          { type: array, items: { $ref: "#/components/schemas/LaboratoryResultAttachment" } }
        bookingId: { type: string, format: uuid }
        components:
          { type: array, items: { $ref: "#/components/schemas/LaboratoryResultComponent" } }
        createdAt: { type: string, format: date-time }
        criticalResults:
          { type: array, items: { $ref: "#/components/schemas/LaboratoryCriticalResult" } }
        id: { type: string, format: uuid }
        interpretation: { type: [string, "null"] }
        laboratory: { $ref: "#/components/schemas/NamedResource" }
        patient: { $ref: "#/components/schemas/NamedResource" }
        practitioner: { $ref: "#/components/schemas/NamedResource" }
        previousResultId: { type: [string, "null"], format: uuid }
        publishedAt: { type: [string, "null"], format: date-time }
        resultNumber: { type: string }
        service: { $ref: "#/components/schemas/ServiceResource" }
        status: { $ref: "#/components/schemas/LaboratoryResultStatus" }
        summaryFlag: { $ref: "#/components/schemas/LaboratoryResultFlag" }
        updatedAt: { type: string, format: date-time }
        verifiedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
    LaboratoryResultList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/LaboratoryResult" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    LaboratoryCriticalResultList:
      type: object
      additionalProperties: false
      required: [data, pageInfo]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/LaboratoryCriticalResult" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
